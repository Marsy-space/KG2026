<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №3 — Базовые растровые алгоритмы</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f8;
            color: #333;
        }

        #sidebar {
            width: 360px;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            overflow-y: auto;
        }

        h2 {
            font-size: 1.2rem;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group, .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
        }

        input[type="number"], select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 80px; 
            box-sizing: border-box;
        }

        .coords-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        #benchmark-btn {
            background-color: #e67e22;
        }

        #benchmark-btn:hover {
            background-color: #d35400;
        }

        .stats-panel {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 12px;
            font-size: 0.85rem;
        }

        .stats-panel p {
            margin-bottom: 6px;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background: #ffffff;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .info-box {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.4;
            background: #eef7fc;
            padding: 10px;
            border-left: 4px solid #3498db;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Растровые алгоритмы</h2>

    <div class="control-group">
        <label for="algorithm">Алгоритм:</label>
        <select id="algorithm">
            <option value="step">1. Пошаговый алгоритм</option>
            <option value="dda">2. Алгоритм ЦДА (DDA)</option>
            <option value="bresenham_line">3. Алгоритм Брезенхема (отрезок)</option>
            <option value="bresenham_circle">4. Алгоритм Брезенхема (окружность)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="scale">Масштаб (размер пикселя): <span id="scale-val">20</span>px</label>
        <input type="range" id="scale" min="5" max="50" value="20">
    </div>

    <div id="line-inputs" class="control-group">
        <label>Координаты отрезка:</label>
        <div class="coords-group">
            <input type="number" id="x0" value="0" placeholder="X0">
            <input type="number" id="y0" value="0" placeholder="Y0">
            <input type="number" id="x1" value="12" placeholder="X1">
            <input type="number" id="y1" value="8" placeholder="Y1">
        </div>
    </div>

    <div id="circle-inputs" class="control-group" style="display:none;">
        <label>Параметры окружности:</label>
        <div class="coords-group">
            <input type="number" id="cx" value="0" placeholder="X центра">
            <input type="number" id="cy" value="0" placeholder="Y центра">
        </div>
        <div style="margin-top: 6px;">
            <input type="number" id="radius" value="10" placeholder="Радиус (R)" style="width: 100%;">
        </div>
    </div>

    <button id="draw-btn">Отрисовать</button>
    <button id="benchmark-btn">Сравнить время (10 000 итераций)</button>

    <div class="stats-panel">
        <p><strong>Время выполнения:</strong> <span id="time-taken">0.00</span> ms</p>
        <p><strong>Количество пикселей:</strong> <span id="pixel-count">0</span></p>
    </div>

    <div id="benchmark-results" class="stats-panel" style="display:none;">
        <p><strong>Результаты замера (ms):</strong></p>
        <ul id="benchmark-list" style="padding-left: 18px; margin-top: 5px;"></ul>
    </div>

    <div class="info-box">
        <strong>Привязка координат:</strong><br>
        Центр каждого пикселя имеет целочисленные координаты $(x, y)$. Линии сетки соответствуют полуцелым значениям $(x \pm 0.5, y \pm 0.5)$.
    </div>
</div>

<div id="canvas-container">
    <canvas id="gridCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    // Controls
    const algoSelect = document.getElementById('algorithm');
    const scaleInput = document.getElementById('scale');
    const scaleVal = document.getElementById('scale-val');
    const drawBtn = document.getElementById('draw-btn');
    const benchmarkBtn = document.getElementById('benchmark-btn');
    const lineInputs = document.getElementById('line-inputs');
    const circleInputs = document.getElementById('circle-inputs');

    let scale = parseInt(scaleInput.value);

    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        draw();
    }

    window.addEventListener('resize', resizeCanvas);

    scaleInput.addEventListener('input', (e) => {
        scale = parseInt(e.target.value);
        scaleVal.textContent = scale;
        draw();
    });

    algoSelect.addEventListener('change', () => {
        if (algoSelect.value === 'bresenham_circle') {
            lineInputs.style.display = 'none';
            circleInputs.style.display = 'flex';
        } else {
            lineInputs.style.display = 'flex';
            circleInputs.style.display = 'none';
        }
        draw();
    });

    // --- АЛГОРИТМЫ РАСТЕРИЗАЦИИ ---

    // 1. Пошаговый алгоритм
    function stepAlgorithm(x0, y0, x1, y1) {
        const pixels = [];
        if (x0 === x1 && y0 === y1) {
            pixels.push({x: x0, y: y0});
            return pixels;
        }

        let dx = x1 - x0;
        let dy = y1 - y0;

        if (Math.abs(dx) >= Math.abs(dy)) {
            if (x0 > x1) { [x0, x1] = [x1, x0]; [y0, y1] = [y1, y0]; }
            let k = (y1 - y0) / (x1 - x0);
            let b = y0 - k * x0;
            for (let x = x0; x <= x1; x++) {
                let y = Math.round(k * x + b);
                pixels.push({x, y});
            }
        } else {
            if (y0 > y1) { [x0, x1] = [x1, x0]; [y0, y1] = [y1, y0]; }
            let k = (x1 - x0) / (y1 - y0);
            let b = x0 - k * y0;
            for (let y = y0; y <= y1; y++) {
                let x = Math.round(k * y + b);
                pixels.push({x, y});
            }
        }
        return pixels;
    }

    // 2. Алгоритм ЦДА (DDA)
    function ddaAlgorithm(x0, y0, x1, y1) {
        const pixels = [];
        let dx = x1 - x0;
        let dy = y1 - y0;
        let l = Math.max(Math.abs(dx), Math.abs(dy));

        if (l === 0) {
            pixels.push({x: x0, y: y0});
            return pixels;
        }

        let xInc = dx / l;
        let yInc = dy / l;

        let x = x0;
        let y = y0;

        for (let i = 0; i <= l; i++) {
            pixels.push({x: Math.round(x), y: Math.round(y)});
            x += xInc;
            y += yInc;
        }
        return pixels;
    }

    // 3. Алгоритм Брезенхема (отрезок)
    function bresenhamLineAlgorithm(x0, y0, x1, y1) {
        const pixels = [];
        let dx = Math.abs(x1 - x0);
        let dy = Math.abs(y1 - y0);
        let sx = (x0 < x1) ? 1 : -1;
        let sy = (y0 < y1) ? 1 : -1;
        let err = dx - dy;

        let x = x0;
        let y = y0;

        while (true) {
            pixels.push({x, y});
            if (x === x1 && y === y1) break;
            let e2 = 2 * err;
            if (e2 > -dy) {
                err -= dy;
                x += sx;
            }
            if (e2 < dx) {
                err += dx;
                y += sy;
            }
        }
        return pixels;
    }

    // 4. Алгоритм Брезенхема (окружность)
    function bresenhamCircleAlgorithm(cx, cy, r) {
        const pixels = [];
        let x = 0;
        let y = r;
        let d = 3 - 2 * r;

        function addSymmetricPoints(cx, cy, x, y) {
            pixels.push({x: cx + x, y: cy + y});
            pixels.push({x: cx - x, y: cy + y});
            pixels.push({x: cx + x, y: cy - y});
            pixels.push({x: cx - x, y: cy - y});
            pixels.push({x: cx + y, y: cy + x});
            pixels.push({x: cx - y, y: cy + x});
            pixels.push({x: cx + y, y: cy - x});
            pixels.push({x: cx - y, y: cy - x});
        }

        addSymmetricPoints(cx, cy, x, y);

        while (y >= x) {
            x++;
            if (d > 0) {
                y--;
                d = d + 4 * (x - y) + 10;
            } else {
                d = d + 4 * x + 6;
            }
            addSymmetricPoints(cx, cy, x, y);
        }

        // Фильтрация дубликатов для корректного подсчета
        const uniquePixels = Array.from(new Set(pixels.map(p => `${p.x},${p.y}`)))
            .map(str => {
                const [x, y] = str.split(',').map(Number);
                return {x, y};
            });

        return uniquePixels;
    }

    // --- ОТРИСОВКА И ИНТЕРФЕЙС ---

    function drawGrid(originX, originY) {
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;

        // Вертикальные линии
        for (let x = originX % scale; x < canvas.width; x += scale) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }

        // Горизонтальные линии
        for (let y = originY % scale; y < canvas.height; y += scale) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // Оси X и Y
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(0, originY);
        ctx.lineTo(canvas.width, originY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(originX, 0);
        ctx.lineTo(originX, canvas.height);
        ctx.stroke();

        // Подписи координат
        ctx.fillStyle = '#666666';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        for (let x = originX % scale; x < canvas.width; x += scale) {
            let gridX = Math.round((x - originX) / scale);
            if (gridX !== 0 && scale >= 15) {
                ctx.fillText(gridX, x, originY + 4);
            }
        }

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let y = originY % scale; y < canvas.height; y += scale) {
            let gridY = Math.round((originY - y) / scale);
            if (gridY !== 0 && scale >= 15) {
                ctx.fillText(gridY, originX - 4, y);
            }
        }
    }

    function fillPixel(gridX, gridY, originX, originY, color = 'rgba(52, 152, 219, 0.7)') {
        let canvasX = originX + gridX * scale - scale / 2;
        let canvasY = originY - gridY * scale - scale / 2;

        ctx.fillStyle = color;
        ctx.fillRect(canvasX, canvasY, scale, scale);
        ctx.strokeStyle = '#2980b9';
        ctx.strokeRect(canvasX, canvasY, scale, scale);
    }

    function drawIdealLine(x0, y0, x1, y1, originX, originY) {
        ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(originX + x0 * scale, originY - y0 * scale);
        ctx.lineTo(originX + x1 * scale, originY - y1 * scale);
        ctx.stroke();
    }

    function drawIdealCircle(cx, cy, r, originX, originY) {
        ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(originX + cx * scale, originY - cy * scale, r * scale, 0, 2 * Math.PI);
        ctx.stroke();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const originX = Math.floor(canvas.width / 2 / scale) * scale;
        const originY = Math.floor(canvas.height / 2 / scale) * scale;

        drawGrid(originX, originY);

        const algo = algoSelect.value;
        let pixels = [];
        let t0 = performance.now();

        if (algo === 'step') {
            let x0 = parseInt(document.getElementById('x0').value) || 0;
            let y0 = parseInt(document.getElementById('y0').value) || 0;
            let x1 = parseInt(document.getElementById('x1').value) || 0;
            let y1 = parseInt(document.getElementById('y1').value) || 0;
            pixels = stepAlgorithm(x0, y0, x1, y1);
            drawIdealLine(x0, y0, x1, y1, originX, originY);
        } else if (algo === 'dda') {
            let x0 = parseInt(document.getElementById('x0').value) || 0;
            let y0 = parseInt(document.getElementById('y0').value) || 0;
            let x1 = parseInt(document.getElementById('x1').value) || 0;
            let y1 = parseInt(document.getElementById('y1').value) || 0;
            pixels = ddaAlgorithm(x0, y0, x1, y1);
            drawIdealLine(x0, y0, x1, y1, originX, originY);
        } else if (algo === 'bresenham_line') {
            let x0 = parseInt(document.getElementById('x0').value) || 0;
            let y0 = parseInt(document.getElementById('y0').value) || 0;
            let x1 = parseInt(document.getElementById('x1').value) || 0;
            let y1 = parseInt(document.getElementById('y1').value) || 0;
            pixels = bresenhamLineAlgorithm(x0, y0, x1, y1);
            drawIdealLine(x0, y0, x1, y1, originX, originY);
        } else if (algo === 'bresenham_circle') {
            let cx = parseInt(document.getElementById('cx').value) || 0;
            let cy = parseInt(document.getElementById('cy').value) || 0;
            let r = parseInt(document.getElementById('radius').value) || 0;
            pixels = bresenhamCircleAlgorithm(cx, cy, r);
            drawIdealCircle(cx, cy, r, originX, originY);
        }

        let t1 = performance.now();

        pixels.forEach(p => fillPixel(p.x, p.y, originX, originY));

        document.getElementById('time-taken').textContent = (t1 - t0).toFixed(4);
        document.getElementById('pixel-count').textContent = pixels.length;
    }

    drawBtn.addEventListener('click', draw);

    // --- БЕНЧМАРК (ЗАМЕР ВРЕМЕНИ) ---
    benchmarkBtn.addEventListener('click', () => {
        const iterations = 10000;
        const x0 = 0, y0 = 0, x1 = 500, y1 = 300, r = 250;

        // Пошаговый
        let t0 = performance.now();
        for(let i=0; i<iterations; i++) stepAlgorithm(x0, y0, x1, y1);
        let tStep = performance.now() - t0;

        // ЦДА
        t0 = performance.now();
        for(let i=0; i<iterations; i++) ddaAlgorithm(x0, y0, x1, y1);
        let tDda = performance.now() - t0;

        // Брезенхем (линия)
        t0 = performance.now();
        for(let i=0; i<iterations; i++) bresenhamLineAlgorithm(x0, y0, x1, y1);
        let tBresLine = performance.now() - t0;

        // Брезенхем (окружность)
        t0 = performance.now();
        for(let i=0; i<iterations; i++) bresenhamCircleAlgorithm(0, 0, r);
        let tBresCircle = performance.now() - t0;

        const list = document.getElementById('benchmark-list');
        list.innerHTML = `
            <li>Пошаговый: <b>${tStep.toFixed(2)}</b> ms</li>
            <li>ЦДА: <b>${tDda.toFixed(2)}</b> ms</li>
            <li>Брезенхем (отрезок): <b>${tBresLine.toFixed(2)}</b> ms</li>
            <li>Брезенхем (окружность): <b>${tBresCircle.toFixed(2)}</b> ms</li>
        `;
        document.getElementById('benchmark-results').style.display = 'block';
    });

    // Инициализация
    resizeCanvas();
</script>
</body>
</html>
